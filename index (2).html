<script>

const K="stok_reagen_lite_v1",M={

function stock(o){return o.qty-db.u.filter(x=>x.oid==o.id).reduce((a,x)=>a+x.qty,0)}
async function loadRemote(){
  const [oRes,uRes]=await Promise.all([
    supabaseClient.from("pembukaan_reagen").select("*").order("tanggal_pembukaan",{ascending:false}),
    supabaseClient.from("pemakaian_reagen").select("*").order("tanggal_pemakaian",{ascending:false})
  ]);
  if(oRes.error)throw oRes.error; if(uRes.error)throw uRes.error;
  db.o=(oRes.data||[]).map(x=>({id:x.id,masterId:x.master_reagen_id,name:x.nama_reagen,barcode:"",lot:x.lot||"",exp:x.expired||"",od:x.tanggal_pembukaan,qty:+x.jumlah_awal,unit:x.satuan||"unit",loc:x.lokasi||"",staff:x.petugas||"",notes:x.catatan||""}));
  db.u=(uRes.data||[]).map(x=>({id:x.id,oid:x.pembukaan_id,masterId:x.master_reagen_id,name:x.nama_reagen,lot:x.lot||"",qty:+x.jumlah_pakai,unit:x.satuan||"unit",date:x.tanggal_pemakaian,loc:x.lokasi||"",staff:x.petugas||"",notes:x.catatan||""}));
  saveLocal(); dbReady=true; fillView();
}
async function ensureMaster(name,barcode,unit,loc){
  let q=supabaseClient.from("master_reagen").select("*").eq("nama_reagen",name).limit(1);
  const {data,error}=await q; if(error)throw error;
  if(data&&data.length)return data[0];
  const ins=await supabaseClient.from("master_reagen").insert({nama_reagen:name,barcode:barcode||null,satuan_default:unit||null,lokasi_default:loc||null}).select().single();
  if(ins.error)throw ins.error; return ins.data;
}
async function saveOpenRemote(){
  let n=$("name").value.trim(),q=+$("qty").value;
  if(!n||!q||!$("od").value){alert("Isi nama, jumlah, dan tanggal pembukaan.");return}
  try{
    const unit=$("unit").value.trim()||"unit",loc=$("loc").value;
    const m=await ensureMaster(n,$("barcode").value.trim(),unit,loc);
    const ins=await supabaseClient.from("pembukaan_reagen").insert({master_reagen_id:m.id,nama_reagen:n,lot:$("lot").value.trim()||null,expired:$("exp").value||null,tanggal_pembukaan:$("od").value,jumlah_awal:q,satuan:unit,lokasi:loc,petugas:$("openStaff")?.value?.trim()||null,catatan:$("openNotes")?.value?.trim()||null}).select().single();
    if(ins.error)throw ins.error; alert("Pembukaan tersimpan"); await loadRemote(); ["barcode","name","lot","exp","qty","unit","openStaff","openNotes"].forEach(x=>$(x).value=""); $("od").value=today();
  }catch(e){console.error(e);alert("Gagal menyimpan ke database: "+e.message)}
}
function identify(v){
  const raw=normalizeBarcode(v);
  if(M[raw])return M[raw];
  for(const code in M){
    if(raw.includes(code))return M[code];
  }
  return null;
}
function normalizeBarcode(v){
  return String(v||"")
    .replace(/\]d[0-9]/gi,"")
    .replace(/[\x1d\u001d\s()]/g,"")
    .trim();
}
function parseGS1(v){
  v=normalizeBarcode(v);
  const out={gtin:"",lot:"",exp:"",mfg:""};
  const pos=v.indexOf("01");
  if(pos>=0 && v.length>=pos+16){
    out.gtin=v.substring(pos+2,pos+16);
    let p=pos+16;
    while(p<v.length){
      const ai=v.substring(p,p+2);
      if(ai==="11" && p+8<=v.length){out.mfg=v.substring(p+2,p+8);p+=8;continue;}
      if(ai==="17" && p+8<=v.length){out.exp=v.substring(p+2,p+8);p+=8;continue;}
      if(ai==="10"){out.lot=v.substring(p+2);break;}
      p++;
    }
  }
  return out;
}
function gs1Date(s){
  if(!/^\d{6}$/.test(s))return "";
  const yy=s.substring(0,2),mm=s.substring(2,4),dd=s.substring(4,6);
  return "20"+yy+"-"+mm+"-"+dd;
}
function fill(){
  const v=$("barcode").value.trim();
  const p=parseGS1(v);
  const n=M[p.gtin] || identify(v);
  if(n){
    $("name").value=n;
    if(p.lot)$("lot").value=p.lot;
    if(p.exp)$("exp").value=gs1Date(p.exp);
    $("result").innerHTML='<div class="ok">✓ <b>'+n+'</b><br>'+
      (p.gtin?'GTIN: '+p.gtin+'<br>':'')+
      (p.lot?'LOT: <b>'+p.lot+'</b><br>':'')+
      (p.exp?'Expired: <b>'+gs1Date(p.exp)+'</b>':'')+
      '</div>';
  }else if(v){
    $("result").innerHTML='<div class="warn">Barcode terbaca, tetapi GTIN <b>'+(p.gtin||v)+'</b> belum ada di database mapping.</div>';
  }
}
let fillTimer=null;
$("barcode").oninput=()=>{clearTimeout(fillTimer);fillTimer=setTimeout(fill,100)};
async function decodeLocalFirst(file){
  if(!file)return;
  if("BarcodeDetector" in window){
    try{
      const detector=new BarcodeDetector({
        formats:["data_matrix","code_128","code_39","ean_13","ean_8","upc_a","upc_e"]
      });
      const bitmap=await createImageBitmap(file);
      const codes=await detector.detect(bitmap);
      if(bitmap.close)bitmap.close();
      if(codes&&codes.length){
        const value=String(codes[0].rawValue||"").trim();
        if(value){$("barcode").value=value;fill();return true;}
      }
    }catch(e){
      try{
        const detector=new BarcodeDetector();
        const bitmap=await createImageBitmap(file);
        const codes=await detector.detect(bitmap);
        if(bitmap.close)bitmap.close();
        if(codes&&codes.length){
          const value=String(codes[0].rawValue||"").trim();
          if(value){$("barcode").value=value;fill();return true;}
        }
      }catch(e2){}
    }
  }
  return false;
}
async function decodeWithService(file){
  if(!file)return;
  $("result").innerHTML='<div class="ok">⏳ Membaca barcode…</div>';
  if(await decodeLocalFirst(file))return;
  try{
    let sendFile=file;
    try{
      const bmp=await createImageBitmap(file);
      const maxW=1400, scale=Math.min(1,maxW/bmp.width);
      const canvas=document.createElement("canvas");
      canvas.width=Math.round(bmp.width*scale);
      canvas.height=Math.round(bmp.height*scale);
      const ctx=canvas.getContext("2d",{alpha:false});
      ctx.drawImage(bmp,0,0,canvas.width,canvas.height);
      if(bmp.close)bmp.close();
      const blob=await new Promise(r=>canvas.toBlob(r,"image/jpeg",0.82));
      if(blob)sendFile=blob;
    }catch(e){}
    const fd=new FormData();
    fd.append("File",sendFile,"barcode.jpg");
    const res=await fetch("https://api.leepow.com/barcode",{method:"POST",body:fd});
    if(!res.ok)throw new Error();
    const data=await res.json(),items=data&&data.data?data.data:[];
    if(!items.length)throw new Error();
    const value=String(items[0].value||"").trim();
    if(!value)throw new Error();
    $("barcode").value=value;
    fill();
  }catch(e){
    $("result").innerHTML='<div class="warn">Barcode belum terbaca. Coba foto lagi dengan barcode terlihat jelas.</div>';
  }
}

async function editOpen(id){
  const o=db.o.find(x=>String(x.id)===String(id));
  if(!o){alert("Data pembukaan tidak ditemukan.");return;}
  const n=prompt("Nama reagen / pemeriksaan",o.name||""); if(n===null)return;
  const lot=prompt("LOT / Batch",o.lot||""); if(lot===null)return;
  const exp=prompt("Expired (YYYY-MM-DD)",o.exp||""); if(exp===null)return;
  const od=prompt("Tanggal pembukaan (YYYY-MM-DD)",o.od||""); if(od===null)return;
  const qtyRaw=prompt("Jumlah awal",String(o.qty??"")); if(qtyRaw===null)return;
  const unit=prompt("Satuan (test / strip / pcs)",o.unit||"unit"); if(unit===null)return;
  const loc=prompt("Lokasi",o.loc||""); if(loc===null)return;
  const staff=prompt("Petugas",o.staff||""); if(staff===null)return;
  const notes=prompt("Catatan",o.notes||""); if(notes===null)return;
  const qty=Number(qtyRaw);
  if(!n.trim()||!od||!Number.isFinite(qty)||qty<=0){alert("Data pembukaan tidak valid.");return;}
  const used=db.u.filter(x=>String(x.oid)===String(o.id)).reduce((a,x)=>a+(Number(x.qty)||0),0);
  if(qty<used){alert("Jumlah awal tidak boleh lebih kecil dari total pemakaian yang sudah tercatat ("+used+").");return;}
  if(!confirm("Simpan perubahan data pembukaan ini?"))return;
  try{
    const up=await supabaseClient.from("pembukaan_reagen").update({
      nama_reagen:n.trim(),lot:lot.trim()||null,expired:exp||null,tanggal_pembukaan:od,
      jumlah_awal:qty,satuan:unit.trim()||"unit",lokasi:loc.trim()||null,
      petugas:staff.trim()||null,catatan:notes.trim()||null,updated_at:new Date().toISOString()
    }).eq("id",id);
    if(up.error)throw up.error;
    alert("Data pembukaan berhasil diubah.");
    await loadRemote();
  }catch(e){console.error(e);alert("Gagal mengubah data pembukaan: "+e.message)}
}
async function editUse(id){
  const x=db.u.find(v=>String(v.id)===String(id));
  if(!x){alert("Data pemakaian tidak ditemukan.");return;}
  const o=db.o.find(v=>String(v.id)===String(x.oid));
  const name=prompt("Nama reagen / pemeriksaan",x.name||""); if(name===null)return;
  const lot=prompt("LOT / Batch",x.lot||""); if(lot===null)return;
  const date=prompt("Tanggal pemakaian (YYYY-MM-DD)",x.date||""); if(date===null)return;
  const qtyRaw=prompt("Jumlah pemakaian",String(x.qty??"")); if(qtyRaw===null)return;
  const unit=prompt("Satuan",x.unit||o?.unit||"unit"); if(unit===null)return;
  const loc=prompt("Lokasi",x.loc||o?.loc||""); if(loc===null)return;
  const staff=prompt("Petugas",x.staff||""); if(staff===null)return;
  const notes=prompt("Catatan",x.notes||""); if(notes===null)return;
  const qty=Number(qtyRaw);
  if(!name.trim()||!date||!Number.isFinite(qty)||qty<=0){alert("Data pemakaian tidak valid.");return;}
  if(o && qty>stock(o)+Number(x.qty||0)){alert("Jumlah pemakaian melebihi stok yang tersedia.");return;}
  if(!confirm("Simpan perubahan data pemakaian ini?"))return;
  try{
    const up=await supabaseClient.from("pemakaian_reagen").update({
      nama_reagen:name.trim(),lot:lot.trim()||null,tanggal_pemakaian:date,
      jumlah_pakai:qty,satuan:unit.trim()||"unit",lokasi:loc.trim()||null,
      petugas:staff.trim()||null,catatan:notes.trim()||null,updated_at:new Date().toISOString()
    }).eq("id",id);
    if(up.error)throw up.error;
    alert("Data pemakaian berhasil diubah.");
    await loadRemote();
  }catch(e){console.error(e);alert("Gagal mengubah data pemakaian: "+e.message)}
}
window.editOpen=editOpen; window.editUse=editUse; window.delRecord=delRecord;
async function delRecord(kind,id){
  const password=prompt("Masukkan password untuk menghapus data:");
  if(password===null)return;
  if(password!=="hapus123"){alert("Password salah. Data tidak dihapus.");return;}
  if(!confirm("Password benar. Yakin ingin menghapus data ini?"))return;
  try{
    if(kind==="o"){
      const hasUse=db.u.some(x=>x.oid==id);
      if(hasUse){alert("Pembukaan ini masih memiliki data pemakaian. Hapus data pemakaian terlebih dahulu.");return}
      const r=await supabaseClient.from("pembukaan_reagen").delete().eq("id",id);
      if(r.error)throw r.error;
    }else{
      const r=await supabaseClient.from("pemakaian_reagen").delete().eq("id",id);
      if(r.error)throw r.error;
    }
    alert("Data berhasil dihapus.");
    await loadRemote();
  }catch(e){alert("Gagal menghapus data: "+e.message)}
}
function jsArg(v){return "'"+String(v).replace(/\\/g,"\\\\").replace(/'/g,"\\'")+"'";}
function bindActionButtons(){document.querySelectorAll("[data-edit-open]").forEach(b=>b.onclick=()=>editOpen(b.dataset.editOpen));document.querySelectorAll("[data-edit-use]").forEach(b=>b.onclick=()=>editUse(b.dataset.editUse));document.querySelectorAll("[data-delete-kind]").forEach(b=>b.onclick=()=>delRecord(b.dataset.deleteKind,b.dataset.deleteId));}
function fillView(){
  let s=$("stocklist");
  s.innerHTML=db.o.length?db.o.slice().reverse().map(o=>'<div class="item"><b>'+o.name+'</b><br><span class="small">Lot '+(o.lot||"-")+' • Exp '+(o.exp||"-")+' • '+(o.loc||"-")+'</span><br>Sisa: <b>'+stock(o)+' '+o.unit+'</b><br><button class="btn secondary" data-edit-open="'+String(o.id)+'">✏️ Edit</button> <button class="btn secondary" data-delete-kind="o" data-delete-id="'+String(o.id)+'">🗑️ Hapus</button></div>').join(''):'<span class="small">Belum ada data.</span>';
  let u=$("uselot");
  u.innerHTML=db.o.filter(o=>stock(o)>0).map(o=>'<option value="'+String(o.id)+'">'+o.name+' — Lot '+(o.lot||"-")+ ' — '+stock(o)+' '+o.unit+'</option>').join('');
  let h=[...db.o.map(o=>({d:o.od,k:"Pembukaan",name:o.name,lot:o.lot,q:o.qty,unit:o.unit,id:o.id})),...db.u.map(x=>({d:x.date,k:"Pemakaian",name:x.name,lot:x.lot,q:x.qty,unit:x.unit,id:x.id}))].sort((a,b)=>b.d.localeCompare(a.d));
  $("histlist").innerHTML=h.length?h.map(x=>'<div class="item"><b>'+x.k+' — '+x.name+'</b><br><span class="small">'+x.d+' • Lot '+(x.lot||"-")+' • '+x.q+' '+x.unit+'</span><br><button class="btn secondary" '+(x.k==="Pembukaan"?'data-edit-open="'+String(x.id)+'"':'data-edit-use="'+String(x.id)+'"')+'>✏️ Edit</button> <button class="btn secondary" data-delete-kind="'+(x.k==="Pembukaan"?'o':'u')+'" data-delete-id="'+String(x.id)+'">🗑️ Hapus</button></div>').join(''):'<span class="small">Belum ada riwayat.</span>';
  bindActionButtons();
}
