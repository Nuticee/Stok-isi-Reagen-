<!doctype html><html lang="id"><head>
<meta charset="utf-8"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stok Reagen Lite V1</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f3f5f7;color:#17202a}
header{background:#111827;color:#fff;padding:14px}h1{font-size:19px;margin:0}.sub{font-size:12px;opacity:.75}
nav{display:flex;gap:5px;background:#fff;padding:8px;position:sticky;top:0;z-index:3}nav button{flex:1;padding:10px 4px;border:0;border-radius:7px;background:#e5e7eb;font-weight:bold;font-size:12px}nav .on{background:#111827;color:#fff}
main{max-width:700px;margin:auto;padding:10px}.card{background:#fff;border:1px solid #ddd;border-radius:9px;padding:12px;margin-bottom:10px}
label{display:block;font-size:12px;font-weight:bold;margin:8px 0 4px}input,select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:7px;font-size:14px}
.row{display:flex;gap:7px}.row>div{flex:1}.btn{border:0;border-radius:7px;padding:10px 12px;font-weight:bold}.primary{background:#111827;color:#fff}.secondary{background:#e5e7eb}
#reader{background:#111;border-radius:7px;overflow:hidden;margin:8px 0}#reader video{width:100%;display:block}
.ok{margin-top:8px;padding:9px;background:#ecfdf5;border:1px solid #a7f3d0;border-radius:7px}.warn{margin-top:8px;padding:9px;background:#fff7ed;border:1px solid #fed7aa;border-radius:7px}
.item{padding:9px 0;border-bottom:1px solid #eee}.small{font-size:12px;color:#667085}.hidden{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.show{display:flex}.modalbox{background:#fff;border-radius:12px;padding:14px;width:min(520px,100%);max-height:90vh;overflow:auto}.modalbox h3{margin:0 0 10px}.modal-actions{display:flex;gap:8px;margin-top:12px}.modal-actions .btn{flex:1}
</style></head><body>
<header><h1>Stok Reagen Lite</h1><div class="sub">Pembukaan • Pemakaian • Stok</div></header>
<nav><button class="on" data-t="open">📦 Buka</button><button data-t="use">🧪 Pakai</button><button data-t="stock">📊 Stok</button><button data-t="hist">📋 Riwayat</button></nav>
<main>
<section id="open">
<div class="card"><b>📷 Scan Barcode</b><div id="reader" class="hidden"></div>
<div class="row" style="margin-top:8px">
<button class="btn primary" id="scan">📷 Scan Barcode</button>
<button class="btn secondary" id="photo">🖼️ Foto Barcode</button>
</div>
<input id="cameraFile" type="file" accept="image/*" capture="environment" hidden>
<input id="photoFile" type="file" accept="image/*" hidden>
<label>Barcode</label><input id="barcode" placeholder="Hasil scan akan muncul di sini"><div id="result"></div><div class="small" style="margin-top:7px">Barcode bisa berada di bagian mana saja dalam foto.</div></div>
<div class="card"><b>📦 Pembukaan Reagen</b>
<label>Nama Reagen / Pemeriksaan</label><input id="name" placeholder="Otomatis jika barcode dikenal">
<div class="row"><div><label>Lot / Batch</label><input id="lot"></div><div><label>Expired</label><input id="exp" type="date"></div></div>
<div class="row"><div><label>Tanggal Pembukaan</label><input id="od" type="date"></div><div><label>Jumlah Awal</label><input id="qty" type="number" min="1"></div></div>
<div class="row"><div><label>Satuan</label><input id="unit" placeholder="test / strip / pcs"></div><div><label>Lokasi</label><select id="loc"><option>Lemari Reagen</option><option>Kulkas / Lemari Pendingin</option><option>Suhu Ruang</option><option>Lainnya</option></select></div></div>
<button class="btn primary" id="saveOpen" style="width:100%;margin-top:10px">Simpan Pembukaan</button></div>
</section>
<section id="use" class="hidden"><div class="card"><b>🧪 Pemakaian</b><label>Reagen / Lot</label><select id="uselot"></select><label>Jumlah</label><input id="useqty" type="number" min="1"><label>Tanggal</label><input id="ud" type="date"><label>Petugas</label><input id="staff"><button class="btn primary" id="saveUse" style="width:100%;margin-top:10px">Simpan Pemakaian</button></div></section>
<section id="stock" class="hidden"><div class="card"><b>📊 Stok</b><div id="stocklist"></div></div></section>
<section id="hist" class="hidden"><div class="card"><b>📋 Riwayat</b><div id="histlist"></div></div><div class="card"><button class="btn secondary" id="csv">Export CSV</button> <button class="btn secondary" id="backup">Backup JSON</button></div></section>
</main>

<div id="editModal" class="modal"><div class="modalbox">
<h3 id="editTitle">✏️ Edit</h3>
<div id="editFields"></div>
<div class="modal-actions"><button class="btn secondary" id="editCancel">Batal</button><button class="btn primary" id="editSave">Simpan Perubahan</button></div>
</div></div>
<script>
const K="stok_reagen_lite_v1",M={
"08806133000021":"Rapid T3","08806133000748":"Rapid CRP","08806133001066":"Rapid HbA1c","08806679002619":"TSH","08806679002411":"T4",
"06903053010665":"M-30D DILUENT","06934645995218":"M-10CFL LYSE",
"06944904052274":"M-52D DILUENT","06944904030210":"Probe Cleanser",
"10006775997632335320":"M-52DIFF LYSE","04213252799901365193":"M-52LH LYSE",
"00A10005-0555-042EV":"M-52LH LYSE","00A10005-0559-042DP":"M-52DIFF LYSE"};
let db=JSON.parse(localStorage.getItem(K)||'{"o":[],"u":[]}'),stream=null;
const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10);
$("od").value=today();$("ud").value=today();
function save(){localStorage.setItem(K,JSON.stringify(db))}
function stock(o){return o.qty-db.u.filter(x=>x.oid==o.id).reduce((a,x)=>a+x.qty,0)}
function identify(v){
  const raw=normalizeBarcode(v);
  if(M[raw])return M[raw];
  for(const code in M){
    if(raw.includes(code))return M[code];
  }
  return null;
}
function normalizeBarcode(v){
  return String(v||"")
    .replace(/\]d[0-9]/gi,"")
    .replace(/[\x1d\u001d\s()]/g,"")
    .trim();
}
function parseGS1(v){
  v=normalizeBarcode(v);
  const out={gtin:"",lot:"",exp:"",mfg:""};
  const pos=v.indexOf("01");
  if(pos>=0 && v.length>=pos+16){
    out.gtin=v.substring(pos+2,pos+16);
    let p=pos+16;
    while(p<v.length){
      const ai=v.substring(p,p+2);
      if(ai==="11" && p+8<=v.length){out.mfg=v.substring(p+2,p+8);p+=8;continue;}
      if(ai==="17" && p+8<=v.length){out.exp=v.substring(p+2,p+8);p+=8;continue;}
      if(ai==="10"){out.lot=v.substring(p+2);break;}
      p++;
    }
  }
  return out;
}
function gs1Date(s){
  if(!/^\d{6}$/.test(s))return "";
  const yy=s.substring(0,2),mm=s.substring(2,4),dd=s.substring(4,6);
  return "20"+yy+"-"+mm+"-"+dd;
}
function fill(){
  const v=$("barcode").value.trim();
  const p=parseGS1(v);
  const n=M[p.gtin] || identify(v);
  if(n){
    $("name").value=n;
    if(p.lot)$("lot").value=p.lot;
    if(p.exp)$("exp").value=gs1Date(p.exp);
    $("result").innerHTML='<div class="ok">✓ <b>'+n+'</b><br>'+
      (p.gtin?'GTIN: '+p.gtin+'<br>':'')+
      (p.lot?'LOT: <b>'+p.lot+'</b><br>':'')+
      (p.exp?'Expired: <b>'+gs1Date(p.exp)+'</b>':'')+
      '</div>';
  }else if(v){
    $("result").innerHTML='<div class="warn">Barcode terbaca, tetapi GTIN <b>'+(p.gtin||v)+'</b> belum ada di database mapping.</div>';
  }
}
let fillTimer=null;
$("barcode").oninput=()=>{clearTimeout(fillTimer);fillTimer=setTimeout(fill,100)};
async function decodeLocalFirst(file){
  if(!file)return;
  if("BarcodeDetector" in window){
    try{
      const detector=new BarcodeDetector({
        formats:["data_matrix","code_128","code_39","ean_13","ean_8","upc_a","upc_e"]
      });
      const bitmap=await createImageBitmap(file);
      const codes=await detector.detect(bitmap);
      if(bitmap.close)bitmap.close();
      if(codes&&codes.length){
        const value=String(codes[0].rawValue||"").trim();
        if(value){$("barcode").value=value;fill();return true;}
      }
    }catch(e){
      try{
        const detector=new BarcodeDetector();
        const bitmap=await createImageBitmap(file);
        const codes=await detector.detect(bitmap);
        if(bitmap.close)bitmap.close();
        if(codes&&codes.length){
          const value=String(codes[0].rawValue||"").trim();
          if(value){$("barcode").value=value;fill();return true;}
        }
      }catch(e2){}
    }
  }
  return false;
}
async function decodeWithService(file){
  if(!file)return;
  $("result").innerHTML='<div class="ok">⏳ Membaca barcode…</div>';
  if(await decodeLocalFirst(file))return;
  try{
    let sendFile=file;
    try{
      const bmp=await createImageBitmap(file);
      const maxW=1400, scale=Math.min(1,maxW/bmp.width);
      const canvas=document.createElement("canvas");
      canvas.width=Math.round(bmp.width*scale);
      canvas.height=Math.round(bmp.height*scale);
      const ctx=canvas.getContext("2d",{alpha:false});
      ctx.drawImage(bmp,0,0,canvas.width,canvas.height);
      if(bmp.close)bmp.close();
      const blob=await new Promise(r=>canvas.toBlob(r,"image/jpeg",0.82));
      if(blob)sendFile=blob;
    }catch(e){}
    const fd=new FormData();
    fd.append("File",sendFile,"barcode.jpg");
    const res=await fetch("https://api.leepow.com/barcode",{method:"POST",body:fd});
    if(!res.ok)throw new Error();
    const data=await res.json(),items=data&&data.data?data.data:[];
    if(!items.length)throw new Error();
    const value=String(items[0].value||"").trim();
    if(!value)throw new Error();
    $("barcode").value=value;
    fill();
  }catch(e){
    $("result").innerHTML='<div class="warn">Barcode belum terbaca. Coba foto lagi dengan barcode terlihat jelas.</div>';
  }
}
$("scan").onclick=()=>{
  $("cameraFile").value="";
  $("cameraFile").click();
};
$("photo").onclick=()=>{
  $("photoFile").value="";
  $("photoFile").click();
};
$("cameraFile").onchange=e=>decodeWithService(e.target.files[0]);
$("photoFile").onchange=e=>decodeWithService(e.target.files[0]);
$("saveOpen").onclick=()=>{let n=$("name").value.trim(),q=+$("qty").value;if(!n||!q||!$("od").value){alert("Isi nama, jumlah, dan tanggal pembukaan.");return}db.o.push({id:Date.now(),name:n,barcode:$("barcode").value.trim(),lot:$("lot").value.trim(),exp:$("exp").value,od:$("od").value,qty:q,unit:$("unit").value.trim()||"unit",loc:$("loc").value});save();alert("Pembukaan tersimpan");["barcode","name","lot","exp","qty","unit"].forEach(x=>$(x).value="");$("od").value=today();fillView()};
$("saveUse").onclick=()=>{let o=db.o.find(x=>x.id==+$("uselot").value),q=+$("useqty").value;if(!o||!q){alert("Pilih reagen dan jumlah.");return}if(q>stock(o)){alert("Jumlah melebihi stok.");return}db.u.push({id:Date.now(),oid:o.id,name:o.name,lot:o.lot,qty:q,unit:o.unit,date:$("ud").value,staff:$("staff").value});save();alert("Pemakaian tersimpan");$("useqty").value="";$("staff").value="";fillView()};
let editKind="",editId=null;
function openEdit(kind,id){
  editKind=kind;editId=id;
  const f=$("editFields"), title=$("editTitle");
  if(kind==="o"){
    const o=db.o.find(x=>x.id==id);if(!o)return;
    title.textContent="✏️ Edit Pembukaan Reagen";
    f.innerHTML=`<label>Nama Reagen / Pemeriksaan</label><input id="ef_name" value="${esc(o.name)}">
      <div class="row"><div><label>Lot / Batch</label><input id="ef_lot" value="${esc(o.lot||"")}"></div><div><label>Expired</label><input id="ef_exp" type="date" value="${esc(o.exp||"")}"></div></div>
      <div class="row"><div><label>Tanggal Pembukaan</label><input id="ef_date" type="date" value="${esc(o.od||"")}"></div><div><label>Jumlah Awal</label><input id="ef_qty" type="number" min="1" value="${o.qty||1}"></div></div>
      <div class="row"><div><label>Satuan</label><input id="ef_unit" value="${esc(o.unit||"unit")}"></div><div><label>Lokasi</label><select id="ef_loc"><option>Lemari Reagen</option><option>Kulkas / Lemari Pendingin</option><option>Suhu Ruang</option><option>Lainnya</option></select></div></div>`;
    $("ef_loc").value=o.loc||"Lemari Reagen";
  }else{
    const x=db.u.find(v=>v.id==id);if(!x)return;
    const o=db.o.find(v=>v.id==x.oid);
    title.textContent="✏️ Edit Pemakaian";
    f.innerHTML=`<div class="ok">Reagen: <b>${esc(o?o.name:x.name)}</b><br>Lot: <b>${esc(o?o.lot:(x.lot||"-"))}</b><br><span class="small">Nama dan LOT mengikuti pembukaan/lot yang dipakai. Untuk mengubahnya, edit data Pembukaan.</span></div>
      <div class="row"><div><label>Tanggal Pemakaian</label><input id="ef_date" type="date" value="${esc(x.date||"")}"></div><div><label>Jumlah Pemakaian</label><input id="ef_qty" type="number" min="1" value="${x.qty||1}"></div></div>
      <label>Petugas</label><input id="ef_staff" value="${esc(x.staff||"")}">`;
  }
  $("editModal").classList.add("show");
}
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function closeEdit(){$("editModal").classList.remove("show");editKind="";editId=null;}
function saveEdit(){
  if(editKind==="o"){
    const o=db.o.find(x=>x.id==editId);if(!o)return;
    const qty=+$('ef_qty').value;
    const used=db.u.filter(v=>v.oid==o.id).reduce((a,v)=>a+v.qty,0);
    if(!$('ef_name').value.trim()||!qty||!$('ef_date').value){alert("Isi nama, jumlah, dan tanggal pembukaan.");return;}
    if(qty<used){alert("Jumlah awal tidak boleh lebih kecil dari total pemakaian yang sudah tercatat ("+used+").");return;}
    o.name=$('ef_name').value.trim();o.lot=$('ef_lot').value.trim();o.exp=$('ef_exp').value;o.od=$('ef_date').value;o.qty=qty;o.unit=$('ef_unit').value.trim()||"unit";o.loc=$('ef_loc').value;
    db.u.filter(v=>v.oid==o.id).forEach(v=>{v.name=o.name;v.lot=o.lot;v.unit=o.unit});
    save();closeEdit();fillView();
  }else if(editKind==="u"){
    const x=db.u.find(v=>v.id==editId);if(!x)return;
    const q=+$('ef_qty').value,o=db.o.find(v=>v.id==x.oid);
    if(!q||!$('ef_date').value){alert("Isi jumlah dan tanggal pemakaian.");return;}
    if(o && q>stock(o)+x.qty){alert("Jumlah melebihi stok.");return;}
    x.date=$('ef_date').value;x.qty=q;x.staff=$('ef_staff').value.trim();
    if(o){x.name=o.name;x.lot=o.lot;x.unit=o.unit;}
    save();closeEdit();fillView();
  }
}
function editOpen(id){openEdit("o",id)}
function editUse(id){openEdit("u",id)}
$("editCancel").onclick=closeEdit;
$("editSave").onclick=saveEdit;
$("editModal").onclick=e=>{if(e.target.id==="editModal")closeEdit()};
function delRecord(kind,id){if(!confirm("Hapus data ini?"))return;if(kind==="o")db.o=db.o.filter(x=>x.id!=id);else db.u=db.u.filter(x=>x.id!=id);save();fillView()}
function fillView(){let s=$("stocklist");s.innerHTML=db.o.length?db.o.slice().reverse().map(o=>'<div class="item"><b>'+o.name+'</b><br><span class="small">Lot '+(o.lot||"-")+' • Exp '+(o.exp||"-")+' • '+o.loc+'</span><br>Sisa: <b>'+stock(o)+' '+o.unit+'</b><br><button class="btn secondary" onclick="editOpen('+o.id+')">✏️ Edit</button> <button class="btn secondary" onclick="delRecord(\'o\','+o.id+')">🗑️ Hapus</button></div>').join(""):'<span class="small">Belum ada data.</span>';let u=$("uselot");u.innerHTML=db.o.filter(o=>stock(o)>0).map(o=>'<option value="'+o.id+'">'+o.name+' — Lot '+(o.lot||"-")+ ' — '+stock(o)+' '+o.unit+'</option>').join("");let h=[...db.o.map(o=>({d:o.od,k:"Pembukaan",name:o.name,lot:o.lot,q:o.qty,unit:o.unit,id:o.id})),...db.u.map(x=>{const o=db.o.find(v=>v.id==x.oid);return {d:x.date,k:"Pemakaian",name:o?o.name:x.name,lot:o?o.lot:x.lot,q:x.qty,unit:o?o.unit:x.unit,id:x.id}})].sort((a,b)=>b.d.localeCompare(a.d));$("histlist").innerHTML=h.length?h.map(x=>'<div class="item"><b>'+x.k+' — '+x.name+'</b><br><span class="small">'+x.d+' • Lot '+(x.lot||"-")+' • '+x.q+' '+x.unit+'</span><br><button class="btn secondary" onclick="'+(x.k==="Pembukaan"?'editOpen('+x.id+')':'editUse('+x.id+')')+'">✏️ Edit</button> <button class="btn secondary" onclick="delRecord(\''+(x.k==="Pembukaan"?'o':'u')+'\','+x.id+')">🗑️ Hapus</button></div>').join(""):'<span class="small">Belum ada riwayat.</span>'}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("main>section").forEach(s=>s.classList.add("hidden"));$(b.dataset.t).classList.remove("hidden");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));b.classList.add("on");fillView()});
function dl(blob,n){let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=n;a.click()}
$("backup").onclick=()=>dl(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}),"backup_stok_reagen.json");
$("csv").onclick=()=>{let r=[["Tanggal","Jenis","Reagen","Lot","Jumlah","Satuan"]];db.o.forEach(o=>r.push([o.od,"Pembukaan",o.name,o.lot,o.qty,o.unit]));db.u.forEach(x=>r.push([x.date,"Pemakaian",x.name,x.lot,x.qty,x.unit]));dl(new Blob(["\ufeff"+r.map(a=>a.map(v=>'"'+String(v||"").replaceAll('"','""')+'"').join(",")).join("\n")],{type:"text/csv"}),"stok_reagen.csv")};
fillView();
</script><script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}
</script>
</body></html>
